services:
  umami-recipe-importer:
    image: ghcr.io/rmonk/umami-importer:latest
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO:-rmonk/umami-recipe-relay}
      GITHUB_PAGES_BASE: ${GITHUB_PAGES_BASE:-https://rmonk.github.io/umami-recipe-relay}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    labels:
      tsbridge.enabled: "true"
      tsbridge.service.name: ${TSBRIDGE_SERVICE_NAME:-umami-importer}
      tsbridge.service.port: "8000"
      tsbridge.service.tags: ${TSBRIDGE_SERVICE_TAGS:-}
      # Publishing a recipe (extraction + image re-host + GitHub commits +
      # waiting for Pages to deploy) routinely takes 40-90s, well past
      # tsbridge's 30s default write_timeout -- without this, tsbridge cuts
      # the connection before the (successfully completing) response comes
      # back, which looks like an infinite spinner that "eventually" times
      # out even though the import went through.
      tsbridge.service.write_timeout: "100s"
    restart: unless-stopped

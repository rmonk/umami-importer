<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Umami recipe importer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
  fieldset { margin-bottom: 1.5rem; }
  input[type=url], input[type=file] { width: 100%; padding: 0.5rem; box-sizing: border-box; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; }
  .error { color: #b00020; }
</style>
</head>
<body>
<h1>Umami recipe importer</h1>
<p>Paste a recipe URL, or upload a PDF. This extracts the recipe, republishes
it as a clean page, and hands you a link that umami.recipes' own importer
can parse reliably.</p>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post" action="/import" enctype="multipart/form-data">
  <fieldset>
    <legend>From a URL</legend>
    <input type="url" name="url" placeholder="https://example.com/some-recipe">
  </fieldset>
  <fieldset>
    <legend>Or from a PDF</legend>
    <input type="file" name="pdf" accept="application/pdf">
  </fieldset>
  <button type="submit">Extract recipe</button>
</form>
</body>
</html>

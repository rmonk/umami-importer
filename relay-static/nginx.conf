# Plain static file server for the relay volume. The CORS header matters:
# umami.recipes' client-side preview needs it to load the re-hosted photo,
# and nginx doesn't send one by default (GitHub Pages, the previous host for
# this content, did -- this replaces that).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header Access-Control-Allow-Origin * always;

    # Declare UTF-8 in the Content-Type header itself. The pages' own
    # <meta charset="utf-8"> is enough for browsers, but umami.recipes'
    # importer goes by the header alone -- without a charset there it reads
    # the bytes as Latin-1, turning "½" into "Â½" in imported recipes.
    charset utf-8;
    charset_types text/html text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ =404;
    }
}
